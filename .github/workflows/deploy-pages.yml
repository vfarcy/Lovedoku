name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir site
          cp index.html site/index.html
          BUILD_INFO="Build #${BUILD_NUMBER} — généré le $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          export BUILD_INFO
          python3 - <<'PY'
          from pathlib import Path
          import os

          page = Path("site/index.html")
          html = page.read_text(encoding="utf-8")
          marker = "Build local"
          if html.count(marker) != 1:
              raise SystemExit(f"Expected one build marker in {page}, found {html.count(marker)}")
          page.write_text(html.replace(marker, os.environ["BUILD_INFO"]), encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
